# Render Blueprint for the Checksum backend API.
# Render → New → Blueprint → pick this repo. The frontend stays on Vercel.
services:
  - type: web
    name: checksum-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore          # closest Render region to India; change if you like
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # ONE worker only: jobs are kept in memory, and each worker process would
    # have its own separate copy (requests would randomly 404).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Pin Python: Render's default for new services is 3.14, which some
      # compiled packages (xgboost / shap / numba) may not support yet.
      - key: PYTHON_VERSION
        value: 3.11.9
      # Your Vercel URL(s), comma-separated, no trailing slash.
      - key: CHECKSUM_CORS_ORIGINS
        value: https://checksum-one.vercel.app
      - key: CHECKSUM_REQUIRE_HTTPS_EXTERNAL
        value: "true"
      - key: CHECKSUM_MAX_UPLOAD_MB
        value: "10"
      - key: CHECKSUM_JOB_TTL_HOURS
        value: "24"
