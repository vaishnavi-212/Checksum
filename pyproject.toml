[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checksum-backend"
version = "0.1.0"
description = "Checksum bias audit API — model-agnostic hiring fairness pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "xgboost>=2.0",
    "scikit-learn",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "shap>=0.45",
    "fairlearn>=0.10",
    "langgraph>=0.1",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "interface*", "pipeline*", "orchestration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
